general:
  seed: 42
  device: "cuda"

data:
  raw_data_dir: "data/raw/"
  processed_data_dir: "data/processed/"
  train_data: "data/processed/train.csv"
  val_data: "data/processed/val.csv"

model:
  name: "custom_cnn"
  input_size: 224
  num_classes: 100
  pretrained: false

training:
  batch_size: 64
  epochs: 100
  optimizer:
    type: "RAdamScheduleFree"
    learning_rate: 1e-3
    weight_decay: 1e-6

logging:
  log_dir: "outputs/logs/"
  checkpoint_dir: "models/checkpoints/"
  checkpoint_interval: 10

evaluation:
  batch_size: 64
  metrics:
    - accuracy
    - macro_f1